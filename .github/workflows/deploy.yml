name: Deploy notes to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: vault
          fetch-depth: 0 # git history -> "last modified" dates
      - name: Get Quartz (pinned)
        run: |
          git clone https://github.com/jackyzha0/quartz.git quartz
          git -C quartz checkout 97a2d05
          cp vault/quartz.config.yaml quartz/
          cat vault/.github/quartz-custom.scss vault/.github/board-styles/*.scss > quartz/quartz/styles/custom.scss 2>/dev/null || cp vault/.github/quartz-custom.scss quartz/quartz/styles/custom.scss
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install PDF tools (first pages of the PDFs on the boards)
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Build
        working-directory: quartz
        run: |
          npm ci
          npx quartz plugin install --from-config
          # render boards and math the way Obsidian does (see the scripts for details)
          node ../vault/.github/quartz-obsidian.mjs
          python3 ../vault/.github/obsidian-compat.py ../vault
          sudo apt-get install -y -q --no-install-recommends python3-pil && python3 ../vault/.github/board-pdf-pages.py ../vault
          npx quartz build -d ../vault -o ../public
      - name: Pre-render math (MathJax 4.1.3, Obsidian's settings)
        run: |
          mkdir mathjax && cd mathjax
          npm init -y > /dev/null
          npm i --no-audit --no-fund mathjax@4.1.3 @mathjax/mathjax-tex-font@4.1.3 @mathjax/mathjax-mhchem-font-extension@4.1.3
          cp ../vault/.github/mathjax-prerender.mjs . && node mathjax-prerender.mjs ../public
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: public

  # Pictures of the board boxes (phones pan pictures instead of live text). Taken on macOS so the
  # text is in the same system font as on Apple devices.
  snapshots:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github
      # The site has paths that differ only in case (Quartz writes redirects at the original-case
      # paths), so it must live on a case-sensitive volume here.
      - name: Case-sensitive volume
        run: |
          hdiutil create -size 2g -fs "Case-sensitive APFS" -volname site -type SPARSE "$RUNNER_TEMP/site"
          hdiutil attach "$RUNNER_TEMP/site.sparseimage" -mountpoint /Volumes/site
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: /Volumes/site/public
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Picture the board boxes
        run: |
          mkdir shots && cd shots
          npm init -y > /dev/null
          npm i --no-audit --no-fund playwright@1.64.1
          npx playwright install chromium
          cp ../.github/board-snapshots.mjs . && node board-snapshots.mjs /Volumes/site/public
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /Volumes/site/public

  deploy:
    needs: snapshots
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
