name: Deploy notes to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: vault
          fetch-depth: 0 # git history -> "last modified" dates
      - name: Get Quartz (pinned)
        run: |
          git clone https://github.com/jackyzha0/quartz.git quartz
          git -C quartz checkout 97a2d05
          cp vault/quartz.config.yaml quartz/
          cp vault/.github/quartz-custom.scss quartz/quartz/styles/custom.scss
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Build
        working-directory: quartz
        run: |
          npm ci
          npx quartz plugin install --from-config
          # render boards and math the way Obsidian does (see the scripts for details)
          node ../vault/.github/quartz-obsidian.mjs
          python3 ../vault/.github/obsidian-math.py ../vault
          npx quartz build -d ../vault -o ../public
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
